[project]
name = "agent-runner"
version = "0.0.1"
description = "Agent Runner - Core runtime component for AI Runtime Platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6.1",
    "httpx>=0.28.1",
    "litellm>=1.85.0",
    "openai>=2.21.0",
    "sse-starlette>=3.2.0",
    "tenacity>=9.0.0",
    "structlog>=25.5.0",
    "opentelemetry-api>=1.42.0",
    "opentelemetry-sdk>=1.42.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.0",
    "prometheus-client>=0.21.1",
    "redis>=5.2.1",
    "nacos-sdk-python>=3.2.0",
    "pyyaml>=6.0.2",
    "openai-agents>=0.17.7",
    "tzdata>=2025.3",
    "agent-breaker-conversation-manager-protos==0.0.2",
    "agent-breaker-commons==0.0.1",
    "fancy-grpc-py==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.13",
    "mypy==2.1.0",
]

[[tool.uv.index]]
name = "agentbreaker-private"
url = "https://packages.aliyun.com/6284861a3e81781f3ad0f3e9/pypi/repo-dawn"
explicit = true

[tool.uv.sources]
agent-breaker-conversation-manager-protos = { index = "agentbreaker-private" }
agent-breaker-commons = { index = "agentbreaker-private" }
fancy-grpc-py = { index = "agentbreaker-private" }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
